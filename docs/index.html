<!doctype html>
<html translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="translation" content="no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jesh — A modern Unix shell written in Rust</title>
    <script>
      // GitHub Pages SPA redirect restore
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== window.location.href) {
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script>
      // Aplica o tema e lang antes do React montar para evitar flash (FOUC)
      (function() {
        // Tema
        var stored = localStorage.getItem('jesh-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        // Idioma
        var lang = localStorage.getItem('i18nextLng');
        var supported = ['en', 'pt-BR', 'pt-PT'];
        document.documentElement.lang = supported.includes(lang) ? lang : 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
