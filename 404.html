<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jesh docs</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the full URL in sessionStorage and redirects to index.html
      var l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body></body>
</html>
