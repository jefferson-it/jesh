[package]
name = "jesh"
version = "2.0.1"
edition = "2024"

[dependencies]

libc = "0.2"
rustyline = "14.0.0"
crossterm = "0.29"
glob = "0.3.3"
strsim = "0.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
base64 = "0.22"
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "user"] }
unicode-width = "0.2"
